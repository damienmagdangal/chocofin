[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The URL is supplied at runtime by migrations/env.py, from DATABASE_URL in
# production or from an injected connection under test. Never hardcode it here:
# a URL in a checked-in file is a secret in code.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
