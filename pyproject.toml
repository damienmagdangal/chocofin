[project]
name = "chocofin"
version = "0.1.0"
description = "Telegram-first household ledger"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    # zoneinfo has no bundled IANA database on Windows; without this
    # ZoneInfo("Asia/Manila") raises ZoneInfoNotFoundError.
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The `engine` fixture is session-scoped and holds pooled asyncpg connections.
# With the default function-scoped loop, each test gets a fresh event loop and
# those connections end up "attached to a different loop". Pin both scopes to
# session so the engine and the tests it serves share one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
